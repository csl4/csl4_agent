[project]
name = "agent"
version = "0.1.0"
description = "General-purpose LLM Agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<1.0",
    "pydantic>=2.0,<3.0",
    "litellm>=1.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "bashlex>=0.18",
    "a2a-sdk==1.0.0a2",
    "protobuf>=5.29.5",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph>=1.2.11",
]

[project.scripts]
agent = "agent.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests/unit", "tests/integration"]
markers = [
    "llm: tests that require LLM API calls",
]
