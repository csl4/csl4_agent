[project]
name = "GSagent"
version = "0.1.0"
description = "General-purpose LLM Agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<1.0",
    "pydantic>=2.0,<3.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "bashlex>=0.18",
    "a2a-sdk==1.0.0a2",
    "protobuf>=5.29.5",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph>=1.2.11",
    # 可观测（001-langgraph-otel-refactor）：OpenLLMetry 自动埋点 LangGraph/ChatOpenAI
    "opentelemetry-instrumentation-langchain>=0.55",
    # langchain 生态（002-langchain-ecosystem）：ChatOpenAI 替换 LiteLLMProvider
    "langchain-openai>=0.3",
    # 纯 langgraph 重构（GSDOC langgraph.graph / otel-langgraph）：
    # langchain.agents.create_agent（多 Agent 官方构造器，运行在 LangGraph 之上）
    "langchain>=1.0",
    # SqliteSaver 持久化 checkpointer（会话/断点恢复）+ SqliteStore（长期记忆底层，
    # 随 langgraph-checkpoint-sqlite 提供，无需独立 store 包）
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
agent = "GSagent.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opentelemetry-instrumentation-fastapi>=0.55",
    "opentelemetry-instrumentation-httpx>=0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["GSagent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests/unit", "tests/integration"]
markers = [
    "llm: tests that require LLM API calls",
]
