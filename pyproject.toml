[tool.poetry]
name = "agent"
version = "0.1.0"
description = "General-purpose LLM Agent framework"
authors = ["dev <dev@example.com>"]
readme = "AGENT-DEV.md"
packages = [{ include = "agent" }]

[tool.poetry.dependencies]
python = "^3.10"
typer = ">=0.9,<1.0"
pydantic = ">=2.0,<3.0"
litellm = ">=1.0"
tenacity = ">=8.0"
pyyaml = ">=6.0"
httpx = ">=0.24"
jinja2 = ">=3.0"
rich = ">=13.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
responses = ">=0.23"
ruff = ">=0.4"
mypy = ">=1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require LLM API calls",
]