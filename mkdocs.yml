# ============================================================
# Agent 文档站配置 —— 导航在 nav: 段显式声明（不用 awesome-nav）
# 有部署域名时把 site_url 从 example.com 换成真实地址
# ============================================================

site_name: Agent
site_description: General-purpose LLM Agent framework
site_url: https://example.com/
repo_url: https://github.com/csl4/csl4_agent
repo_name: csl4/csl4_agent
edit_uri: edit/main/docs/

nav:
    - Home: index.md
    - 系统架构: architecture.md
    - 多Agent 编排: multi-agent.md
    - 企业级能力: enterprise.md
    - 实现笔记与踩坑: implementation-notes.md

theme:
    name: material
    custom_dir: docs/overrides
    features:
        - content.code.copy
        - content.tabs.link
        - navigation.footer
        - navigation.indexes
        - navigation.instant
        - navigation.top
        - navigation.tracking
        - search.highlight
        - search.suggest
        - toc.follow
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: teal
          accent: teal
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: teal
          accent: teal
          toggle:
              icon: material/brightness-4
              name: Switch to system preference
    font:
        text: Inter
        code: Fira Code

plugins:
    - search
    - glightbox

markdown_extensions:
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.emoji:
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
          emoji_index: !!python/name:material.extensions.emoji.twemoji
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
          combine_header_slug: true
          slugify: !!python/object/apply:pymdownx.slugs.slugify
              kwds:
                  case: lower
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde

extra_javascript:
    - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
    - javascripts/mermaid-init.js